# Two rules, one per language: an ast-grep rule has a single language, and .mjs parses as
# javascript while .ts parses as typescript (#1816).
id: no-symlink-blind-main-guard
language: javascript
severity: error
message: "Use `isMain(import.meta.url)` from scripts/js/is-main.mjs. `path.resolve(process.argv[1])` keeps the symlink the script was invoked through while `import.meta.url` is resolved, so through a link the guard is false and the script exits 0 without running (#1816)."
rule:
  any:
    - pattern: resolve(process.argv[1]) === $X
    - pattern: $X === resolve(process.argv[1])
---
id: no-symlink-blind-main-guard-ts
language: typescript
severity: error
message: "Use `isMain(import.meta.url)` from scripts/js/is-main.mjs. `path.resolve(process.argv[1])` keeps the symlink the script was invoked through while `import.meta.url` is resolved, so through a link the guard is false and the script exits 0 without running (#1816)."
rule:
  any:
    - pattern: resolve(process.argv[1]) === $X
    - pattern: $X === resolve(process.argv[1])
