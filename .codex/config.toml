# Codex project config generated by navori.

# navori:managed start id="codex-config-base" hash="98d06bc6" version="0.8.7" source="@navori/core"
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[features]
hooks = true
multi_agent = true

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "bash \"$(git rev-parse --show-toplevel)/.codex/hooks/guard-destructive.sh\""
timeout = 30
statusMessage = "Checking destructive command policy"

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "bash \"$(git rev-parse --show-toplevel)/.codex/hooks/model-advisor.sh\" codex-session-start"
timeout = 10
statusMessage = "navori: model advisor"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "bash \"$(git rev-parse --show-toplevel)/.codex/hooks/comment-draft-confirm.sh\""
timeout = 10
statusMessage = "Checking for an unconfirmed comment/review draft"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "bash \"$(git rev-parse --show-toplevel)/.codex/hooks/quality-gate-pre-commit.sh\""
timeout = 600
statusMessage = "Running pre-commit quality gate"

[mcp_servers."engram"]
command = "engram"
args = ["mcp", "--tools=agent"]

[mcp_servers."codegraph"]
command = "codegraph"
args = ["serve", "--mcp"]
env = { "CODEGRAPH_MCP_TOOLS" = "explore", "CODEGRAPH_EXPLORE_DEDUP" = "0" }
# navori:managed end id="codex-config-base"
