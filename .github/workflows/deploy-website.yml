name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - ".github/workflows/deploy-website.yml"
      # The footer prints the released version by importing the CLI manifest
      # (apps/website/src/components/Footer.astro). Without this path a release
      # never redeploys the site, and the footer keeps showing the previous
      # version until some unrelated website change happens to trigger a build.
      - "packages/cli/package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Opt into Node 24 ahead of GitHub's forced switch on 2026-06-16.
  # Removes the "Node.js 20 actions are deprecated" warnings on
  # checkout/setup-node/upload-artifact/deploy-pages/action-setup.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # actions/setup-node has no `cache: bun` (only npm/yarn/pnpm), and bun
      # doesn't ship with Node — install it explicitly, then cache its store
      # keyed on bun.lock so a clean install still reuses the download cache.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        env:
          # Project Pages serve at https://<owner>.github.io/<repo>/.
          # Auto-derived so any fork works without configuration.
          # Override via vars.SITE_URL / vars.SITE_BASE for custom domains.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          SITE_BASE: ${{ vars.SITE_BASE || format('/{0}/', github.event.repository.name) }}
        run: bun run --filter @navori/website build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
