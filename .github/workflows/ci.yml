name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a PR's in-flight run when a newer commit is pushed — no point burning
# minutes on a superseded SHA. `main` pushes get a per-SHA group so releases
# never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Opt into Node 24 ahead of GitHub's forced switch — silences the
  # "Node.js 20 actions are deprecated" warnings (matches deploy-website.yml).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `check:assets` compares the assets against the newest RELEASE TAG.
          # actions/checkout fetches no tags by default, which would make that
          # check skip itself in silence — the blind spot #421 is about.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # actions/setup-node has no `cache: bun` (only npm/yarn/pnpm), and bun
      # doesn't ship with Node — install it explicitly, then cache its store
      # keyed on bun.lock so a clean install still reuses the download cache.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build first: the e2e suite runs against dist/index.js + bundled assets.
      - name: Build
        run: bun run --filter navori build

      # #508 — `apps/website` was built ONLY by the deploy workflow, which runs
      # after the merge, so a change that breaks the site (an Astro/Tailwind
      # upgrade, a bad import, a schema file that stops parsing) surfaced in the
      # deploy instead of on the PR. Same env the deploy uses, so a base-path
      # regression fails here too.
      - name: Build website
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          SITE_BASE: ${{ vars.SITE_BASE || format('/{0}/', github.event.repository.name) }}
        run: bun run --filter @navori/website build

      - name: Bundle size guard
        run: bun run --filter navori check:size

      # #421: this repo dogfoods navori — `.claude/` + `CLAUDE.md` are the OUTPUT
      # of `navori render` over @navori/core. A PR that touches a managed asset
      # WITHOUT re-rendering the mirror leaves the harness (hooks included) running
      # the previous version, which is how #420 shipped a day of stale hook scripts.
      # `check:render` rebuilds before rendering ON PURPOSE (dist/assets/core is a
      # build-time copy of packages/core; rendering with a stale dist compares
      # against the OLD core and passes in silence) — don't "optimize" the rebuild
      # away just because the Build step above already ran.
      - name: Harness mirror up to date
        run: bun run check:render

      # #490 — an asset that orders `navori <cmd>` resolves the PUBLISHED binary,
      # so a PR landing a subcommand plus an asset calling it ships an asset that
      # is broken until the next release (that is how `audit` shipped in #485).
      # Reports, never blocks: failing here would force publishing before merging.
      # The `:ci` variant adds `--strict` (#504), which flips ONE outcome to red:
      # "could not run". The checkout above fetches tags precisely so this check
      # CAN compare against one, so a skip here means that setup regressed — and
      # a check that skipped itself must never read as a check that passed.
      - name: Assets cite released subcommands
        run: bun run check:assets:ci

      - name: Lint
        run: bun run --filter navori lint

      # #461: the build is esbuild, which strips types WITHOUT checking them, so
      # until this step existed nothing verified the strict typing CLAUDE.md
      # declares — 136 errors had accumulated unseen, including a union that made
      # `tsc` report LIVE code as unreachable. Added only after the tree reached
      # zero, so it can never be "temporarily" skipped.
      - name: Typecheck
        run: bun run --filter navori typecheck

      - name: Format check
        run: bun run format:check

      # #819 — nothing else in this job walks the repo's `.md` files;
      # `format:check` above covers only `packages/cli/src` and `apps/website/src`.
      - name: Dead link check
        run: bun run check:links

      # #815 — root `CLAUDE.md` and the managed blocks under
      # `packages/core/core-assets/managed/*.md` render into every session, so
      # an unbounded one grows by accretion. Extends the `SKILL_TYPE_CAPS`
      # word-cap primitive to that prose.
      - name: Doc word budgets
        run: bun run check:doc-budgets

      # #1002 — validates `.git-blame-ignore-revs`: every entry must be an
      # ancestor of `origin/main` (not this branch — a squash merge rewrites
      # the SHA on merge, see the script's own header) and mechanical. Needs
      # full history, which the checkout above provides (fetch-depth: 0).
      - name: Blame-ignore entries are ancestors with a mechanical diff
        run: bun run check:blame-ignore

      # The hook suites run under bash AND zsh (#391) — the hooks execute with
      # whatever shell the host wires in — and ubuntu-latest ships without zsh.
      # The tests skip the zsh rows cleanly when the binary is missing, so this
      # step is what makes the zsh half actually run in CI.
      #
      # `apt-get update` exits 100 if ANY configured source fails, and the runner
      # image ships third-party repos this job never installs from. On 2026-09-09
      # Google's chrome-stable index served a Hash Sum mismatch and that alone
      # turned `main` and both open PRs red, with nothing wrong in the tree. So
      # the update is allowed to report a failing source — the Ubuntu archive it
      # DOES need refreshes fine — and the guarantee moves to where it belongs:
      # `zsh --version` fails the step when the shell the suite needs is missing,
      # so the zsh half can never quietly stop running.
      - name: Install zsh
        run: |
          sudo apt-get update || echo "::warning::apt-get update reported a failing source; continuing"
          sudo apt-get install -y zsh
          zsh --version

      # The full suite AND the coverage gate — on PRs too (#504). Deferring the
      # gate to the `main` push meant a PR could not fail on coverage: the module
      # it left untested was only reported once merged, which is after the only
      # moment the gate can change anything. The suite is the same either way;
      # instrumentation costs seconds.
      - name: Test + coverage gate
        run: bun run --filter navori test:coverage
