name: CI

# `checks` always runs and is the one status `dev` requires: the Rust gate plus the cheap checks.
# The TS suite is gone after the cutover; `asset-suites` keeps the tests that read shipped assets.
on:
  push:
    branches: [main, dev]
  # `labeled` lets a `full` label added after the PR opened start the suite
  # (#1551); listing `types` replaces the defaults, so they are repeated here.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Cancel a PR's in-flight run when a newer commit is pushed — no point burning
# minutes on a superseded SHA. `main` pushes get a per-SHA group so releases
# never cancel each other. Any label other than `full` gets a per-run group: its
# run repeats only `checks`, so it must not cancel the PR's real run.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}${{
    github.event.action == 'labeled' && github.event.label.name != 'full' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  checks:
    # No label filter (#1562): a run whose `checks` read skipped would count as a
    # pass for a required check. Every label run repeats it for real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `check:assets` compares the assets against the newest RELEASE TAG.
          # actions/checkout fetches no tags by default, which would make that
          # check skip itself in silence — the blind spot #421 is about.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # actions/setup-node has no `cache: bun` (only npm/yarn/pnpm), and bun
      # doesn't ship with Node — install it explicitly, then cache its store
      # keyed on bun.lock so a clean install still reuses the download cache.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # C1 (spec 0062 T10): `dev` is the Rust product, so the required `checks` runs its gate:
      # cargo fmt, clippy and test of the workspace, the hook oracle, the artifact suites and the
      # docs checks (`check:post-cutover`). rustup reads the pinned toolchain, components and
      # targets from rust-toolchain.toml.
      - id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-checks-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-checks-

      - run: rustup show active-toolchain

      # The ONE build: the e2e suite runs against dist/index.js + bundled assets.
      # `ensure-dist` seals `dist/` with the fingerprint of its inputs, so
      # `check:render` and the test suite below find the seal and build nothing.
      - name: Build
        run: bun run ensure-dist

      # #508 — `apps/website` was built ONLY by the deploy workflow, which runs
      # after the merge, so a change that breaks the site (an Astro/Tailwind
      # upgrade, a bad import, a schema file that stops parsing) surfaced in the
      # deploy instead of on the PR. Same env the deploy uses, so a base-path
      # regression fails here too.
      - name: Build website
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          SITE_BASE: ${{ vars.SITE_BASE || format('/{0}/', github.event.repository.name) }}
        run: bun run --filter @navori/website build

      # #421: this repo dogfoods navori — `.claude/` + `CLAUDE.md` are the OUTPUT
      # of `navori render` over @navori/core. A PR that touches a managed asset
      # WITHOUT re-rendering the mirror leaves the harness (hooks included) running
      # the previous version, which is how #420 shipped a day of stale hook scripts.
      # `check:render` still verifies `dist/` is fresh before rendering
      # (dist/assets/core is a build-time copy of packages/core; rendering with a
      # stale dist compares against the OLD core and passes in silence), but it
      # does so through the seal: the fingerprint covers `packages/core`,
      # `packages/plugins` and the build config, so the Build step above is
      # reused and a stale dist would rebuild instead of passing.
      - name: Harness mirror up to date
        run: bun run check:render

      - name: Rust gate and post-cutover checks
        run: bun run check:post-cutover

      # #490 — an asset that orders `navori <cmd>` resolves the PUBLISHED binary,
      # so a PR landing a subcommand plus an asset calling it ships an asset that
      # is broken until the next release (that is how `audit` shipped in #485).
      # Reports, never blocks: failing here would force publishing before merging.
      # The `:ci` variant adds `--strict` (#504), which flips ONE outcome to red:
      # "could not run". The checkout above fetches tags precisely so this check
      # CAN compare against one, so a skip here means that setup regressed — and
      # a check that skipped itself must never read as a check that passed.
      - name: Assets cite released subcommands
        run: bun run check:assets:ci

      - name: Format check
        run: bun run format:check

      # Duplication against the committed `.jscpd-baseline.json` and the project
      # ast-grep rules (+ their rule tests). Both are lockfile devDependencies, so
      # a missing tool fails the step instead of skipping it.
      - name: Duplication check
        run: bun run check:dup

      - name: ast-grep rules
        run: bun run check:ast

      # #819 — nothing else in this job walks the repo's `.md` files;
      # `format:check` above covers only `packages/cli/src` and `apps/website/src`.
      - name: Dead link check
        run: bun run check:links

      # #815 — root `CLAUDE.md` and the managed blocks under
      # `packages/core/core-assets/managed/*.md` render into every session, so
      # an unbounded one grows by accretion. Extends the `SKILL_TYPE_CAPS`
      # word-cap primitive to that prose.
      - name: Doc word budgets
        run: bun run check:doc-budgets

      # #1002 — validates `.git-blame-ignore-revs`: every entry must be an
      # ancestor of `origin/main` (not this branch — a squash merge rewrites
      # the SHA on merge, see the script's own header) and mechanical. Needs
      # full history, which the checkout above provides (fetch-depth: 0).
      - name: Blame-ignore entries are ancestors with a mechanical diff
        run: bun run check:blame-ignore

      # Spec 0055 R21 — a test case may not disappear unannounced: every `*.test.ts` changed or
      # deleted against the merge-base with `origin/dev` keeps its cases and `// Covers:` tokens,
      # or declares the removal (with a reason) in `scripts/js/test-preservation.config.json`.
      # On a push to `dev` the merge-base is HEAD, so the step is trivial there. A PR to `dev`
      # compares against the event's base SHA, not the live tip of `origin/dev` (#1566).
      - name: Test cases are preserved or their removal is declared
        env:
          PR_BASE_SHA: ${{ github.base_ref == 'dev' && github.event.pull_request.base.sha || '' }}
        run: bun run check:tests-preserved ${PR_BASE_SHA:+--base "$PR_BASE_SHA"}

  # The published CLI declares `engines.node` >=22.12, below the `.nvmrc` every other job runs on.
  # Build with the dev toolchain (tsdown's own floor is higher), then switch to the floor and
  # smoke-test `dist/` with plain Node: vitest cannot run there, its global setup rebuilds `dist/`.
  # The `full` label cancels the PR's in-flight run, so that labeled run repeats this job.
  node-floor:
    if: github.event.action != 'labeled' || github.event.label.name == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run ensure-dist

      # Must equal the floor of `engines.node` in packages/cli/package.json (toolchain-pins.test.ts).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12"

      - name: Smoke-test the built CLI on the published Node floor
        run: node packages/cli/scripts/smoke-node-floor.mjs

  # The TS tests that stay after the cutover (spec 0062 T10): only those that read the shipped
  # assets, the plugin assets or the docs, from the explicit list in scripts/js/asset-suites.mjs.
  # Outside the R18 budget of `check:post-cutover`, which runs the artifact suites itself.
  asset-suites:
    if: github.event.action != 'labeled' || github.event.label.name == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Install zsh
        run: |
          sudo apt-get update || echo "::warning::apt-get update reported a failing source; continuing"
          sudo apt-get install -y zsh
          zsh --version

      - name: Build
        run: bun run ensure-dist

      - name: Asset and docs suites
        run: bun run test:assets

  # The step before publishing (spec 0062 D53, README § Releases): every PR to main checks that
  # packaging/legacy.json pins a published navori-legacy reachable from HEAD and that packages/cli
  # stays private. Here and not in rust-release.yml, whose `paths:` filter would skip a dev → main
  # PR that touches none of them.
  legacy-pin:
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && (github.event.action != 'labeled' || github.event.label.name == 'full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pinned commit must be reachable to prove it is an ancestor of HEAD.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: node scripts/js/dist-assemble.mjs check-pin

  # Semgrep `p/default` on `main` only (pushes and PRs into it). Diff-scoped via
  # `--baseline-commit`: only findings new since BASE block, so the pre-existing
  # ones stay debt. No `|| true`: exit 1 (new findings) and exit >1 (broken
  # scanner) both fail the job, so a scan that could not run never reads green.
  semgrep:
    if: (github.ref == 'refs/heads/main' || github.base_ref == 'main') && (github.event.action != 'labeled' || github.event.label.name == 'full')
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline commit must be reachable.
          fetch-depth: 0

      - name: Semgrep scan (new findings only)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE="${PR_BASE_SHA:-$PUSH_BEFORE}"
          # New branch / first push: `before` is all zeros.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1)
          fi
          semgrep scan --config p/default --error --metrics=off \
            --baseline-commit "$BASE" --sarif --output semgrep.sarif

      # Fork PRs get a read-only token, so the upload is skipped for them.
      - name: Upload SARIF
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
