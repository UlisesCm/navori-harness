name: CI

# Checks always run; full coverage uses four shards and one aggregate merge.
# PRs to dev use affected tests unless their plan requires the full suite.
on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel a PR's in-flight run when a newer commit is pushed — no point burning
# minutes on a superseded SHA. `main` pushes get a per-SHA group so releases
# never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `check:assets` compares the assets against the newest RELEASE TAG.
          # actions/checkout fetches no tags by default, which would make that
          # check skip itself in silence — the blind spot #421 is about.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # actions/setup-node has no `cache: bun` (only npm/yarn/pnpm), and bun
      # doesn't ship with Node — install it explicitly, then cache its store
      # keyed on bun.lock so a clean install still reuses the download cache.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The ONE build: the e2e suite runs against dist/index.js + bundled assets.
      # `ensure-dist` seals `dist/` with the fingerprint of its inputs, so
      # `check:render` and the test suite below find the seal and build nothing.
      - name: Build
        run: bun run ensure-dist

      # #508 — `apps/website` was built ONLY by the deploy workflow, which runs
      # after the merge, so a change that breaks the site (an Astro/Tailwind
      # upgrade, a bad import, a schema file that stops parsing) surfaced in the
      # deploy instead of on the PR. Same env the deploy uses, so a base-path
      # regression fails here too.
      - name: Build website
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          SITE_BASE: ${{ vars.SITE_BASE || format('/{0}/', github.event.repository.name) }}
        run: bun run --filter @navori/website build

      - name: Bundle size guard
        run: bun run --filter navori check:size

      # #421: this repo dogfoods navori — `.claude/` + `CLAUDE.md` are the OUTPUT
      # of `navori render` over @navori/core. A PR that touches a managed asset
      # WITHOUT re-rendering the mirror leaves the harness (hooks included) running
      # the previous version, which is how #420 shipped a day of stale hook scripts.
      # `check:render` still verifies `dist/` is fresh before rendering
      # (dist/assets/core is a build-time copy of packages/core; rendering with a
      # stale dist compares against the OLD core and passes in silence), but it
      # does so through the seal: the fingerprint covers `packages/core`,
      # `packages/plugins` and the build config, so the Build step above is
      # reused and a stale dist would rebuild instead of passing.
      - name: Harness mirror up to date
        run: bun run check:render

      # #490 — an asset that orders `navori <cmd>` resolves the PUBLISHED binary,
      # so a PR landing a subcommand plus an asset calling it ships an asset that
      # is broken until the next release (that is how `audit` shipped in #485).
      # Reports, never blocks: failing here would force publishing before merging.
      # The `:ci` variant adds `--strict` (#504), which flips ONE outcome to red:
      # "could not run". The checkout above fetches tags precisely so this check
      # CAN compare against one, so a skip here means that setup regressed — and
      # a check that skipped itself must never read as a check that passed.
      - name: Assets cite released subcommands
        run: bun run check:assets:ci

      - name: Lint
        run: bun run --filter navori lint

      # #461: the build is esbuild, which strips types WITHOUT checking them, so
      # until this step existed nothing verified the strict typing CLAUDE.md
      # declares — 136 errors had accumulated unseen, including a union that made
      # `tsc` report LIVE code as unreachable. Added only after the tree reached
      # zero, so it can never be "temporarily" skipped.
      - name: Typecheck
        run: bun run --filter navori typecheck

      - name: Format check
        run: bun run format:check

      # Duplication against the committed `.jscpd-baseline.json` and the project
      # ast-grep rules (+ their rule tests). Both are lockfile devDependencies, so
      # a missing tool fails the step instead of skipping it.
      - name: Duplication check
        run: bun run check:dup

      - name: ast-grep rules
        run: bun run check:ast

      # #819 — nothing else in this job walks the repo's `.md` files;
      # `format:check` above covers only `packages/cli/src` and `apps/website/src`.
      - name: Dead link check
        run: bun run check:links

      # #815 — root `CLAUDE.md` and the managed blocks under
      # `packages/core/core-assets/managed/*.md` render into every session, so
      # an unbounded one grows by accretion. Extends the `SKILL_TYPE_CAPS`
      # word-cap primitive to that prose.
      - name: Doc word budgets
        run: bun run check:doc-budgets

      # #1002 — validates `.git-blame-ignore-revs`: every entry must be an
      # ancestor of `origin/main` (not this branch — a squash merge rewrites
      # the SHA on merge, see the script's own header) and mechanical. Needs
      # full history, which the checkout above provides (fetch-depth: 0).
      - name: Blame-ignore entries are ancestors with a mechanical diff
        run: bun run check:blame-ignore

      # Spec 0055 R21 — a test case may not disappear unannounced: every `*.test.ts` changed or
      # deleted against the merge-base with `origin/dev` keeps its cases and `// Covers:` tokens,
      # or declares the removal (with a reason) in `scripts/js/test-preservation.config.json`.
      # On a push to `dev` the merge-base is HEAD, so the step is trivial there.
      - name: Test cases are preserved or their removal is declared
        run: bun run check:tests-preserved

  plan:
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - id: plan
        env:
          NAVORI_AFFECTED_BASE: origin/${{ github.base_ref }}
        run: |
          node packages/cli/scripts/test-affected.mjs --plan-json > "$RUNNER_TEMP/affected-plan.json"
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (typeof p.full !== "boolean") throw Error("invalid plan"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "full=" + p.full + "\n")' "$RUNNER_TEMP/affected-plan.json"

  test:
    needs: [plan]
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' || github.base_ref == 'main' ||
          (needs.plan.result == 'success' && needs.plan.outputs.full == 'true')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install zsh
        run: |
          sudo apt-get update || echo "::warning::apt-get update reported a failing source; continuing"
          sudo apt-get install -y zsh
          zsh --version
      - name: Build
        run: bun run ensure-dist
      - name: Coverage shard
        run: node packages/cli/scripts/run-test-coverage.mjs --shard ${{ matrix.shard }}/4
      - name: Upload successful shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: packages/cli/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error

  test-merge:
    needs: [test]
    if: ${{ always() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to succeed
        env:
          SHARD_RESULT: ${{ needs.test.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Download all shard blobs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-shard-*
          merge-multiple: true
          path: packages/cli/.vitest-reports/
      - name: Aggregate coverage, floor and time budget
        env:
          NAVORI_TEST_REPORT: ${{ runner.temp }}/vitest-merged.json
          NAVORI_TEST_BUDGET_FACTOR: "2"
        run: node packages/cli/scripts/run-test-coverage.mjs --merge .vitest-reports --shards 4

  affected:
    needs: [plan]
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && needs.plan.result == 'success' && needs.plan.outputs.full == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install zsh
        run: |
          sudo apt-get update || echo "::warning::apt-get update reported a failing source; continuing"
          sudo apt-get install -y zsh
          zsh --version
      - name: Build
        run: bun run ensure-dist
      - name: Affected subset
        env:
          NAVORI_AFFECTED_BASE: origin/${{ github.base_ref }}
          NAVORI_TEST_REPORT: ${{ runner.temp }}/vitest-affected.json
        run: node packages/cli/scripts/test-affected.mjs
      - name: Affected time budget
        env:
          NAVORI_TEST_BUDGET_FACTOR: "2"
        run: node packages/cli/scripts/check-test-budget.mjs --report "$RUNNER_TEMP/vitest-affected.json"

  # Semgrep `p/default` on `main` only (pushes and PRs into it). Diff-scoped via
  # `--baseline-commit`: only findings new since BASE block, so the pre-existing
  # ones stay debt. No `|| true`: exit 1 (new findings) and exit >1 (broken
  # scanner) both fail the job, so a scan that could not run never reads green.
  semgrep:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline commit must be reachable.
          fetch-depth: 0

      - name: Semgrep scan (new findings only)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE="${PR_BASE_SHA:-$PUSH_BEFORE}"
          # New branch / first push: `before` is all zeros.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1)
          fi
          semgrep scan --config p/default --error --metrics=off \
            --baseline-commit "$BASE" --sarif --output semgrep.sarif

      # Fork PRs get a read-only token, so the upload is skipped for them.
      - name: Upload SARIF
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
