[package]
name = "navori-core"
description = "Shared core of the navori Rust migration: embedded assets and CLI version."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
# `float_roundtrip`: correctly rounded floats, as `JSON.parse` reads them (spec 0058 D22).
serde_json = { workspace = true, features = ["float_roundtrip"] }
ryu-js.workspace = true
regex.workspace = true
sha1.workspace = true
sha2.workspace = true

[features]
# `fs::fault`: fault injection between filesystem steps, for tests only (spec 0058 D24).
fault-injection = []

[[test]]
name = "fs"
required-features = ["fault-injection"]

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
